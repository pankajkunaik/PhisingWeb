name: PhishGuard AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ --select E,W,F --ignore E501

      - name: Type-check with mypy
        run: |
          pip install mypy types-requests
          mypy app/ --ignore-missing-imports --no-strict-optional || true

      - name: Run tests
        env:
          SECRET_KEY: test_secret_key_for_ci
          DATABASE_URL: sqlite:///./test_phishguard.db
          APP_ENV: development
        run: |
          pip install pytest pytest-asyncio httpx
          pytest app/tests/ -v --tb=short || echo "No tests found yet — skipping"

  # ── Frontend Tests ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Docker Build Check ───────────────────────────────────────────────────────
  docker:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t phishguard-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t phishguard-frontend:ci .
