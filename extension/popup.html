<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard AI popup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo">
        <span class="shield-icon">🛡️</span>
        <span class="logo-text">PhishGuard <span class="highlight">AI</span></span>
      </div>
      <div class="status-indicator">
        <span id="status-dot" class="dot gray"></span>
        <span id="status-text">Ready</span>
      </div>
    </div>
    
    <div class="card-body">
      <div class="url-display">
        <span class="url-label">Analyzing:</span>
        <span id="current-url" class="url-text">Loading tab...</span>
      </div>
      
      <div id="risk-score-container" class="score-container hidden">
        <div class="score-circle">
          <span id="risk-score-value">0</span>
          <span class="score-max">/100</span>
        </div>
        <div id="risk-badge" class="badge">Safe</div>
      </div>
      
      <div class="divider"></div>
      
      <div class="diagnostics-list">
        <div class="diagnostic-item">
          <span class="diag-icon" id="diag-ssl-icon">➖</span>
          <span class="diag-label">SSL Encryption</span>
          <span class="diag-status" id="diag-ssl-text">Pending</span>
        </div>
        <div class="diagnostic-item">
          <span class="diag-icon" id="diag-whois-icon">➖</span>
          <span class="diag-label">Domain Age Check</span>
          <span class="diag-status" id="diag-whois-text">Pending</span>
        </div>
        <div class="diagnostic-item">
          <span class="diag-icon" id="diag-feed-icon">➖</span>
          <span class="diag-label">Known Threat List</span>
          <span class="diag-status" id="diag-feed-text">Pending</span>
        </div>
        <div class="diagnostic-item">
          <span class="diag-icon" id="diag-typo-icon">➖</span>
          <span class="diag-label">Typosquatting Check</span>
          <span class="diag-status" id="diag-typo-text">Pending</span>
        </div>
      </div>
    </div>
    
    <div class="card-footer">
      <button id="scan-btn" class="btn btn-primary">Scan Page</button>
      <button id="dashboard-btn" class="btn btn-secondary">Open Dashboard</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
